<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Page title -->
    <title>Weather App</title>

    <!-- App styles -->
    <link rel="stylesheet" href="style.css">

    <!-- Google Material Icons (used for UI icons in the HTML) -->
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
</head>

<body>
    <!-- Main card container (weather + messages) -->
    <main class="main-container">
        <!-- Search header: city input + search button -->
        <header class="input-container">
            <input type="text" class="city-input" placeholder="Search City">
            <button class="search-btn" aria-label="Search city">
                <span class="material-symbols-outlined">
                    search
                </span>
            </button>
        </header>

        <!-- Weather results view (toggled by script.js) -->
        <section class="weather-info" style="display:none">
            <!-- City + current date summary -->
            <div class="location-data-container">
                <div class="location">
                    <span class="material-symbols-outlined">
                        location_on
                    </span>
                    <h4 class="contry-txt">Islamabad</h4>
                </div>
                <h5 class="current-dat-txt regular-txt">Wed, 07 Aug</h5>
            </div>

            <!-- Current weather summary -->
            <div class="weather-summary-container">
                <img src="assets/weather/clouds.svg" class="weather-summary-img" alt="Weather icon">
                <div class="weather-summary-info">
                    <h1 class="temp-txt">29 °C</h1>
                    <h3 class="condition-txt regular-txt">Clouds</h3>
                </div>
            </div>

            <!-- Humidity + wind -->
            <div class="weather-conditions-container">
                <div class="condition-item">
                    <span class="material-symbols-outlined">
                        water_drop
                    </span>
                    <div class="condition-info">
                        <h5 class="regular-txt">Humidity</h5>
                        <h5 class="humidity-value-txt">55%</h5>
                    </div>
                </div>

                <div class="condition-item">
                    <span class="material-symbols-outlined">
                        air
                    </span>
                    <div class="condition-info">
                        <h5 class="regular-txt">Wind Speed</h5>
                        <h5 class="wind-value-txt">2 M/s</h5>
                    </div>
                </div>
            </div>

            <!-- 5-day forecast (populated by script.js) -->
            <div class="forecast-item-container">
                <div class="forecast-item">
                    <h5 class="forecast-item-date regular-txt">05 Aug</h5>
                    <img src="assets/weather/thunderstorm.svg" class="forecast-item-img" alt="Weather icon">
                    <h5 class="forecast-item-temp">29 °C</h5>
                </div>
            </div>
        </section>

        <!-- Search prompt view (shown when the page first loads / waiting for user input) -->
        <section class="search-city section-message">
            <img class="message-img" src="assets/message/search-city.png" alt="Search city message">
            <div>
                <h1>Search City</h1>
                <h4 class="regular-txt">Find out the weather conditions of the city</h4>
            </div>
        </section>

        <!-- Not-found view (toggled by script.js when API returns an error) -->
        <section class="not-found section-message" style="display: none;">
            <img src="assets/message/not-found.png" alt="City not found message">
            <div>
                <h1>Search City</h1>
                <h4 class="regular-txt">Find out the weather conditions of the city</h4>
            </div>
        </section>
    </main>

    <script src="script.js" defer></script>
</body>

</html>
